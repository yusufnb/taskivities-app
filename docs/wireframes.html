<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taskivities — wireframes</title>
<style>
:root{
  --bg:#F7F7F9; --panel:#fff; --line:#E6E6EB; --line2:#F0F0F3;
  --text:#16161D; --muted:#6B6B78; --faint:#A0A0AB;
  --accent:#4F46E5; --accent-ink:#3730A3; --accent-soft:#EEF0FF;
  --late:#D92D20; --late-soft:#FEF1F0;
  --carry:#FFF8F1; --carry-line:#FBD9B5; --carry-ink:#B54708;
  --ok:#12B76A; --r:12px;
  --shadow:0 1px 2px rgba(16,16,29,.04),0 8px 24px rgba(16,16,29,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:#E8E8EE;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
b{font-weight:600}

/* ---------- wireframe shell ---------- */
#shell{display:flex;flex-direction:column;height:100vh}
#wfbar{display:flex;align-items:center;gap:18px;height:52px;padding:0 16px;background:#121218;color:#E9E9F0;flex:none}
.wf-brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.wf-sub{font-weight:400;color:#8A8A98;font-size:12px}
#tabs{display:flex;gap:2px;overflow:auto;flex:1}
#tabs button{padding:7px 9px;border-radius:8px;color:#A9A9B8;white-space:nowrap;font-size:13px}
#tabs button:hover{color:#fff;background:#1F1F28}
#tabs button.on{color:#fff;background:#2A2A36}
#tabs button span{color:#6E6E7E;margin-right:5px;font-variant-numeric:tabular-nums}
#notesBtn{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #33333F;color:#C9C9D6}
#notesBtn.on{background:#2A2A36;color:#fff}
#stage{flex:1;display:flex;min-height:0}
#canvas{flex:1;overflow:auto;padding:24px;min-width:0}
#notes{width:310px;flex:none;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:20px 20px 40px}
#notes.hide{display:none}
#notes h3{margin:0 0 4px;font-size:15px}
#notes .ns{color:var(--muted);font-size:12.5px;margin:0 0 16px}
#notes ol,#notes ul{margin:0;padding-left:18px}
#notes li{margin:0 0 10px;color:#33333D;font-size:13px}
#notes h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}
#notes .kbd{display:inline-block;min-width:20px;text-align:center;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font-size:11.5px;background:#FAFAFB}
.sim-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:13px;margin-top:6px}
.sim-btn:hover{background:#E2E5FF}

/* ---------- browser frame ---------- */
.browser{max-width:1200px;margin:0 auto;height:100%;min-height:640px;background:#fff;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(20,20,40,.14);display:flex;flex-direction:column;overflow:hidden}
.bbar{height:40px;flex:none;display:flex;align-items:center;gap:7px;padding:0 14px;background:#F3F3F6;border-bottom:1px solid var(--line)}
.bbar i{width:11px;height:11px;border-radius:50%;background:#DADAE0}
.bbar .url{margin:0 auto;transform:translateX(-24px);background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 14px;font-size:12px;color:var(--muted);min-width:280px;text-align:center}

/* ---------- app ---------- */
.app{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg);overflow:hidden}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;font-size:15.5px}
.logo-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6366F1,#4338CA);display:grid;place-items:center;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.logo-mark.sm{width:20px;height:20px;border-radius:6px;font-size:12px}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12.5px;color:var(--muted);padding:5px 10px;border-radius:999px;background:#F6F6F8}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(18,183,106,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,183,106,.45)}70%{box-shadow:0 0 0 6px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
.app-scroll{flex:1;overflow:auto}
.page{max-width:860px;margin:0 auto;padding:26px 28px 120px}

.av{--s:22px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:calc(var(--s)*.42);font-weight:600;flex:none;letter-spacing:.02em}

.viewing{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:18px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px}
.viewing .grow{flex:1}
.viewing button{font-weight:600;padding:4px 10px;border-radius:7px;background:#fff;border:1px solid #D8DCFF}

.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:12px;text-align:left;border-radius:12px;padding:4px 8px 4px 4px;margin-left:-4px}
.who:hover{background:#EFEFF3}
.who .h1{font-size:24px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:4px}
.who .h1 svg{color:var(--faint)}
.who .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.who .sub .lt{color:var(--late);font-weight:600}
.weeknav{margin-left:auto;display:flex;align-items:center;gap:6px;padding-top:6px}
.wk{min-width:150px;text-align:center;line-height:1.2}
.wk b{display:block;font-size:13.5px}
.wk span{font-size:12px;color:var(--muted)}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:#EBEBF0;color:var(--text)}
.btn-ghost{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:13px}
.btn-ghost:hover{border-color:#D3D3DB}
.btn-ghost:disabled{opacity:.45;cursor:default}

/* quick add */
.qa{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:28px;transition:border-color .15s,box-shadow .15s}
.qa:focus-within{border-color:#C7CBFF;box-shadow:0 0 0 4px rgba(79,70,229,.08)}
.qa .plus{color:var(--accent);display:grid}
.qa-top{display:flex;align-items:center;gap:8px}
.qa-more{display:none;padding:0 0 2px 28px}
.qa.open .qa-more{display:block;animation:fade .15s}
.qa.open .qa-go-c{display:none}
.qa.open .qa-top input{font-weight:600;font-size:15px}
.qa textarea{display:block;width:100%;border:0;outline:0;resize:none;background:none;padding:2px 2px 10px;font-size:13.5px;line-height:1.5;color:#3A3A45;min-height:44px}
.qa textarea::placeholder{color:var(--faint)}
.qa-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line2);padding-top:8px;margin-right:2px}
.qa-foot .chips{flex:none;flex-wrap:nowrap}
.qa-hint{flex:1;min-width:0;text-align:right;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:4px}
.qa-hint kbd{min-width:16px;height:17px;font-size:10px;padding:0 4px;margin:0 1px}
.qa input{flex:1;border:0;outline:0;background:none;padding:8px 2px;font-size:14.5px;min-width:120px}
.qa input::placeholder{color:var(--faint)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:12.5px;color:#44444F;background:#F5F5F8;white-space:nowrap}
.chip:hover{background:#ECECF2}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.qa .go{padding:7px 12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px}
.qa .go:hover{background:#4338CA}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* sections */
.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sec-h h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.sec-h .cnt{font-size:12.5px;color:var(--muted)}
.day{margin-bottom:14px}
.day-h{display:flex;align-items:center;gap:8px;padding:0 4px 6px;font-size:13px}
.day-h .dn{font-weight:600}
.day-h .dd{color:var(--muted)}
.day-h .dc{margin-left:auto;color:var(--faint);font-size:12px}
.day-h.today .dn{color:var(--accent)}
.today-tag{font-size:11px;font-weight:600;color:#fff;background:var(--accent);padding:1px 7px;border-radius:999px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.empty-day{padding:11px 14px;color:var(--faint);font-size:13px;background:transparent;border:1px dashed #DEDEE5;border-radius:var(--r)}
.collapsed{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:#FBFBFC;color:var(--muted);font-size:13px;text-align:left}
.collapsed:hover{background:#fff}
.collapsed .dn{color:var(--text);font-weight:600}
.collapsed .sum{margin-left:auto;display:flex;gap:10px;align-items:center}
.collapsed .sum .c{color:var(--carry-ink)}
.collapsed svg{color:var(--faint)}

/* carried */
.carried{border:1px solid var(--carry-line);background:var(--carry);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.carried-h{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 14px;font-size:12.5px;color:var(--carry-ink)}
.carried-h b{font-weight:650}
.carried-h .grow{flex:1}
.carried-h button{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;background:#fff;border:1px solid var(--carry-line);font-weight:600;color:var(--carry-ink);font-size:12.5px}
.carried-h button:hover{border-color:#F5B57A}
.carried .row{background:#fff}
.carried .rows{border-top:1px solid var(--carry-line)}

/* rows */
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 10px 6px 14px;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.row:hover{background:#FAFAFC}
.chk{width:19px;height:19px;border-radius:50%;border:1.6px solid #C8C8D2;display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.chk:hover{border-color:var(--accent);color:#C7CBFF}
.row.done .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.row-main{flex:1;min-width:0;text-align:left;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:8px}
.prio{display:inline-grid;place-items:center;flex:none}
.tc-title .prio{display:inline-block;vertical-align:-2px;margin-right:5px}
.row-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row.done .row-title{color:var(--faint);text-decoration:line-through;text-decoration-color:#C9C9D2}
.meta{display:flex;align-items:center;gap:8px;flex:none;font-size:12px;color:var(--muted)}
.proj{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:999px;background:#F4F4F7;color:#55555F;font-size:12px;white-space:nowrap}
.proj i{width:7px;height:7px;border-radius:50%}
.from{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.late{color:var(--late);background:var(--late-soft);font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.due{color:var(--muted);white-space:nowrap}
.datep{white-space:nowrap;color:#44444F}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .12s;flex:none}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.acts .icon-btn{width:28px;height:28px}
.row.ghost{opacity:.62}
.row.ghost .chk{border-style:dashed}
.ghost-tag{font-size:12px;color:var(--carry-ink);white-space:nowrap}
.row.flash{animation:flash 2.6s ease-out}
@keyframes flash{0%,35%{background:#E4E7FF}100%{background:transparent}}
.carried .row.flash{animation:flash 2.6s ease-out}
.grp-h{display:flex;align-items:center;gap:9px;padding:10px 12px 8px 14px;border-top:1px solid var(--line);background:#FCFCFD;font-size:13px}
.grp-h:first-child{border-top:0}
.grp-h b{font-weight:600}
.grp-h .n{color:var(--faint);font-size:12px}
.grp-h .link{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer;font-weight:500}
.grp-h .link:hover{text-decoration:underline}
.empty-sec{padding:26px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed #DEDEE5;border-radius:var(--r)}

/* today peek */
.peek{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:11px 14px;border:1px dashed #D6D6DE;border-radius:var(--r);background:transparent;color:var(--muted);font-size:13px;text-align:left}
button.peek:hover{border-style:solid;border-color:#C7CBFF;background:#fff;color:var(--text)}
.peek b{color:var(--text);font-weight:600}
.peek .pk-d{color:var(--faint)}
.peek .pk-go{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:600;white-space:nowrap}
.peek.quiet{color:var(--faint)}

/* top navigation + projects page */
.topnav{display:flex;gap:2px;margin-left:18px}
.topnav button{padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.topnav button:hover{color:var(--text);background:#F3F3F7}
.topnav button.on{color:var(--text);background:#EEF0FF;color:var(--accent-ink);font-weight:600}
.pbadge{--s:40px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.28);display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s)*.36);flex:none;letter-spacing:.02em}
.pbadge.all{background:#EDEDF2;color:var(--muted)}
.pbadge.all svg{width:55%;height:55%}
.gdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.contrib{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 22px}
.ct{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:#44444F}
.ct b{color:var(--accent-ink);font-weight:700;font-variant-numeric:tabular-nums}
.row.report .row-title{color:var(--text);text-decoration:none}
.row.report .chk{background:var(--ok)!important;border-color:var(--ok)!important}
.datep.tm{color:var(--faint);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}

/* roles + team page */
.wf-as{display:flex;align-items:center;gap:8px;font-size:12px;color:#8A8A98;white-space:nowrap}
.wf-as select{font:inherit;font-size:12.5px;color:#E9E9F0;background:#1F1F28;border:1px solid #33333F;border-radius:7px;padding:4px 8px}
.me{position:relative;display:inline-flex}
.role-dot{position:absolute;right:-6px;bottom:-6px;font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 5px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.role-dot.admin{color:var(--accent-ink);border-color:#D8DCFF;background:#EEF0FF}
.viewing .vh{display:block;color:#5B5BD6;font-size:12px;margin-top:2px}
.pop-foot{padding:8px 10px 4px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line2);margin-top:4px}
.pop-empty{padding:10px;color:var(--faint);font-size:13px}
.pop-body{padding:2px 10px 10px;font-size:13px;color:#44444F}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt:disabled:hover{background:none}
.opt.check .cb{width:16px;height:16px;border-radius:5px;border:1.5px solid #C8C8D2;display:grid;place-items:center;color:#fff;flex:none}
.opt.check.on .cb{background:var(--accent);border-color:var(--accent)}
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:13px}
.btn-primary:hover{background:#4338CA}
.btn-danger{width:100%;padding:8px 12px;border-radius:9px;background:#FEF3F2;color:#B42318;font-weight:600;font-size:13px;border:1px solid #FECDCA}
.btn-danger:hover{background:#FEE4E2}
.team-h{font-size:24px;font-weight:700;letter-spacing:-.02em}
.team .trow{display:grid;grid-template-columns:minmax(200px,1.5fr) 110px minmax(180px,2fr) 120px 40px;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-top:1px solid var(--line2);font-size:13px}
.team .trow:first-child{border-top:0}
.team .trow.th{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding-top:9px;padding-bottom:9px;background:#FCFCFD}
.team .trow.flash{animation:flash 2.6s ease-out}
.tp{display:flex;align-items:center;gap:10px;min-width:0}
.tp b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .you{display:inline;color:var(--faint);font-weight:400}
.team .chip:disabled{opacity:.8;cursor:default}
.tproj .proj{margin:2px 4px 2px 0}
.pbtn{display:flex;flex-wrap:wrap;align-items:center;text-align:left;padding:3px 4px;margin:-3px -4px;border-radius:8px}
.pbtn:hover{background:#F5F5F8}
.pedit{color:var(--faint);display:inline-grid}
.allp{font-size:12.5px;color:var(--muted)}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.st.ok{color:#067647;background:#ECFDF3}
.st.inv{color:#B54708;background:#FFFAEB}
.tact .icon-btn:hover{color:#B42318;background:#FEF3F2}
.fine{font-size:12.5px;color:var(--faint);margin:10px 2px 0}
.prow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line2);font-size:13px}
.prow:first-child{border-top:0}
.prow i{width:9px;height:9px;border-radius:50%}
.prow b{font-weight:600;min-width:150px}
.prow .avs{display:flex}
.prow .avs .av{margin-left:-6px;box-shadow:0 0 0 2px #fff}
.prow .avs .av:first-child{margin-left:0}
.prow .n{color:var(--faint);font-size:12px;margin-left:8px}
.invite{padding:18px 18px 14px;margin-bottom:24px}
.inv-in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;font-size:14px;margin-bottom:14px}
.inv-in:focus{border-color:#C7CBFF;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.inv-err{margin:-8px 0 12px;color:#B42318;font-size:12.5px}
.inv-grid{display:grid;grid-template-columns:auto 1fr;gap:24px;margin-bottom:14px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:#44444F;background:#fff}
.pchip i{width:8px;height:8px;border-radius:50%}
.pchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.muted-s{font-size:12.5px;color:var(--faint)}
.inv-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line2);padding-top:12px}
.inv-foot .muted-s{margin-right:auto}

/* project editor + descriptions */
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94%);max-height:90%;display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(16,16,29,.25);z-index:7;animation:popin .16s ease-out}
.sheet-b{padding:8px 24px 6px;overflow:auto}
.sheet-f{padding:12px 24px 16px;margin:0}
.swatches{display:flex;gap:8px;margin-bottom:16px}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.0)}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
.pe-desc{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;outline:0;font-size:13.5px;line-height:1.5}
.pe-desc:focus{border-color:#C7CBFF;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.pe-help{display:flex;gap:12px;align-items:flex-start;font-size:12px;color:var(--muted);margin:6px 0 16px}
.pe-help span:first-child{display:flex;gap:6px;align-items:flex-start}
.pe-help svg{flex:none;color:var(--accent);margin-top:1px}
.pe-count{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.pchip .av{margin-left:-4px}
.pchip:disabled{opacity:.55;cursor:not-allowed}
.kbd-i{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 4px;background:#FAFAFB;color:#3A3A45}
.pname{display:flex;flex-direction:column;min-width:0;flex:1}
.pname b{min-width:0!important}
.pdesc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.pdesc em{color:var(--faint)}
.btn-ghost.sm{padding:4px 10px;font-size:12px}
.via{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:999px;background:#F4EBFF;color:#6941C6;vertical-align:1px}

/* view toggle */
.seg{display:inline-flex;padding:3px;background:#EDEDF2;border-radius:10px;gap:2px;margin-right:8px}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,16,29,.08)}
.seg button span{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.seg.sm{margin:0}

/* board */
.page.wide{max-width:none;padding-left:22px;padding-right:22px}
.page.wide .qa{max-width:860px}
.board-bar{display:flex;align-items:center;gap:14px;margin:-8px 0 12px;flex-wrap:wrap}
.board-bar .hint{font-size:12.5px;color:var(--faint)}
.board{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr)) repeat(2,minmax(96px,.55fr));gap:10px;align-items:start}
.col{background:#EFEFF3;border-radius:14px;padding:6px;min-height:420px;border:1.5px solid transparent;transition:background .12s,border-color .12s}
.col-h{display:flex;align-items:baseline;gap:6px;padding:6px 8px 9px;font-size:13px}
.col-h .dn{font-weight:650}
.col-h .dd{color:var(--muted);font-size:12px}
.col-h .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.col.today{background:#E9EBFF}
.col.today .col-h .dn{color:var(--accent)}
.col.past{background:#F4F4F7}
.col.past .col-h{opacity:.7}
.col.we{background:#F3F3F6}
.board.is-dragging .col[data-drop]{border-color:#D5D8FF;border-style:dashed}
.board.is-dragging .col.past{opacity:.5}
.col.over{background:#DDE1FF!important;border-color:var(--accent)!important;border-style:solid!important}
.col-b{display:flex;flex-direction:column;gap:6px}
.tcard{position:relative;display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid #E4E4EA;border-radius:10px;padding:9px 9px 8px;box-shadow:0 1px 2px rgba(16,16,29,.04);cursor:grab;transition:box-shadow .12s,transform .12s}
.tcard:hover{box-shadow:0 4px 14px rgba(16,16,29,.09);border-color:#D9D9E2}
.tcard:active{cursor:grabbing}
.tcard.dragging{opacity:.35;transform:scale(.98)}
.tcard .chk{width:16px;height:16px;margin-top:1px}
.tcard.done{background:#FAFAFB;box-shadow:none;cursor:default}
.tcard.done .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.tcard.done .tc-title{color:var(--faint);text-decoration:line-through;text-decoration-color:#C9C9D2}
.tcard.is-late{border-left:3px solid var(--late);padding-left:7px}
.tcard.flash{animation:flash 2.6s ease-out}
.tc-body{flex:1;min-width:0;cursor:pointer}
.tc-title{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-top:6px;font-size:11.5px;color:var(--muted);min-width:0}
.tc-proj{display:inline-flex;align-items:center;gap:5px;min-width:0;flex:1 1 70px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tc-proj i{width:7px;height:7px;border-radius:50%;flex:none}
.tc-meta .late{font-size:10.5px;padding:1px 6px}
.col-carry{background:var(--carry);border:1px solid var(--carry-line);border-radius:11px;padding:6px;display:flex;flex-direction:column;gap:6px;margin-bottom:2px}
.cc-h{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:1px 2px 0 4px;font-size:11.5px;font-weight:650;color:var(--carry-ink)}
.cc-h span{flex:1}
.cc-h button{font-size:11.5px;font-weight:600;color:var(--carry-ink);padding:2px 7px;border-radius:6px;background:#fff;border:1px solid var(--carry-line)}
.col-add{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;font-size:12.5px;color:var(--faint);text-align:left}
.col-add:hover{background:rgba(255,255,255,.7);color:var(--accent)}
.col-note{padding:6px 8px;font-size:12px;color:var(--faint)}

/* keyboard + focus */
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tabs button:focus-visible,#notesBtn:focus-visible{outline-color:#A5B4FC}
.row:focus-visible{outline:none;background:#F4F5FF;box-shadow:inset 3px 0 0 var(--accent)}
.row:focus-visible .acts{opacity:1}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.drawer:focus-visible,.dr-title:focus-visible{outline:none}
.collapsed:focus-visible,.peek:focus-visible,.col-add:focus-visible{outline-offset:1px}
.skip{position:absolute;left:14px;top:-48px;z-index:9;padding:8px 14px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;transition:top .15s}
.skip:focus{top:10px}
.kb-btn{color:var(--faint)}
kbd{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;font:600 11px/1 -apple-system,BlinkMacSystemFont,"Inter",sans-serif;background:#FAFAFB;color:#3A3A45;margin-left:3px}
.help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94%);max-height:88%;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(16,16,29,.25);z-index:7;animation:popin .16s ease-out}
.help-h{display:flex;align-items:center;gap:10px;padding:16px 16px 6px 24px}
.help-h b{font-size:16px}
.help-h .muted{color:var(--faint);font-size:12.5px;margin-right:auto}
.help-b{display:grid;grid-template-columns:1fr 1fr;gap:4px 32px;padding:4px 24px 24px}
.hk-g h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 0 4px}
.hk-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;color:#33333D}
.hk-k{display:flex;align-items:center;white-space:nowrap}
.hk-k i{font-style:normal;font-size:11px;color:var(--faint);margin:0 2px 0 6px}
.board-bar .hint kbd{min-width:18px;height:18px;font-size:10px}

/* drawer */
.backdrop{position:absolute;inset:0;background:rgba(18,18,30,.16);animation:fade .18s}
@keyframes fade{from{opacity:0}}
.drawer{position:absolute;top:0;right:0;bottom:0;width:450px;max-width:100%;background:#fff;box-shadow:-12px 0 40px rgba(16,16,29,.12);display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dr-top{display:flex;align-items:center;gap:8px;padding:12px 14px 12px 22px;border-bottom:1px solid var(--line2)}
.dr-body{flex:1;overflow:auto;padding:20px 22px 40px}
.dr-title{font-size:20px;font-weight:650;letter-spacing:-.015em;line-height:1.3;outline:0;border-radius:6px;padding:2px 4px;margin:0 -4px 14px}
.dr-title:hover{background:#F6F6F9}
.dr-title:focus{background:#F6F6F9;box-shadow:0 0 0 2px #C7CBFF}
.done-btn{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);font-weight:600;font-size:13px;margin-bottom:18px}
.done-btn .chk{width:17px;height:17px}
.done-btn.on{background:#ECFDF3;border-color:#ABEFC6;color:#067647}
.done-btn.on .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.fields{display:grid;grid-template-columns:96px 1fr;gap:4px 8px;margin:0 0 22px;align-items:center}
.fields dt{color:var(--muted);font-size:13px}
.fields dd{margin:0}
.field{display:inline-flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13.5px;margin-left:-8px;max-width:100%;white-space:nowrap}
.field:hover{background:#F3F3F7}
.field svg.c{color:var(--faint)}
.plain{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0}
.lbl{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.lbl .muted{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)}
.dr-body textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;outline:0;margin-bottom:24px;font-size:13.5px}
.dr-body textarea:focus{border-color:#C7CBFF;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.trail{list-style:none;margin:0;padding:0;position:relative}
.trail:before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
.trail li{position:relative;display:flex;gap:12px;padding:0 0 16px}
.trail li .av{position:relative;z-index:1;box-shadow:0 0 0 3px #fff}
.trail .tx{font-size:13px;color:#3A3A45;line-height:1.45}
.trail .tm{font-size:11.5px;color:var(--faint);margin-top:2px}
.trail .note{display:block;margin-top:4px;padding:6px 10px;background:#F6F6F9;border-radius:8px;color:#4A4A55}
.trail li.sys .av{background:#fff!important;border:1.5px dashed #D0D0D8;color:var(--faint)}

/* popover */
#pop{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{position:fixed;pointer-events:auto;width:276px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(16,16,29,.16),0 2px 6px rgba(16,16,29,.06);padding:6px;animation:popin .14s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}}
.pop-h{padding:8px 10px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13.5px;text-align:left}
.opt:hover{background:#F3F3F8}
.opt .r{margin-left:auto;color:var(--faint);font-size:12px}
.opt.cur{color:var(--faint);cursor:default}
.opt.cur:hover{background:none}
.opt i{width:9px;height:9px;border-radius:50%}
.pop-sep{height:1px;background:var(--line2);margin:6px 4px}
.pop input.pin{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:0;font-size:13px;margin:2px 0 6px}
.pop input.pin:focus{border-color:#C7CBFF}
.cal{padding:4px 6px 6px}
.cal-h{display:flex;align-items:center;padding:2px 0 6px}
.cal-h b{flex:1;font-size:13px;text-align:center}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g .dw{font-size:10.5px;color:var(--faint);text-align:center;padding:4px 0}
.cal-g button{height:30px;border-radius:7px;font-size:12.5px}
.cal-g button:hover{background:#EEF0FF}
.cal-g button.om{color:#C8C8D0}
.cal-g button.td{color:var(--accent);font-weight:700}
.cal-g button.sel{background:var(--accent);color:#fff}
.cal-g button:disabled{color:#D9D9E0;cursor:default;background:none}

/* toast */
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#18181F;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .2s ease-out;white-space:nowrap;z-index:5;max-width:92%}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{color:#A5B4FC;font-weight:600;padding:3px 8px;border-radius:6px}
.toast button:hover{background:#2A2A35}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}}

/* sign in */
.signin{flex:1;display:grid;place-items:center;background:radial-gradient(1200px 500px at 50% -10%,#EEF0FF,transparent 70%),var(--bg)}
.si-card{width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 34px 28px;box-shadow:var(--shadow);text-align:center}
.si-card .logo-mark{width:44px;height:44px;border-radius:13px;margin:0 auto 18px}
.si-card h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.si-card p{margin:0 0 26px;color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:11px;border:1px solid #DADCE0;border-radius:10px;font-weight:600;background:#fff}
.gbtn:hover{background:#F8F9FA;border-color:#C6C9CE}
.si-foot{margin-top:18px;font-size:12px;color:var(--faint)}
.si-err{margin-top:14px;font-size:12px;color:var(--muted);background:#F6F6F9;border-radius:8px;padding:8px 10px;text-align:left}

/* mobile frames */
.phones{display:flex;gap:48px;justify-content:center;flex-wrap:wrap;padding:6px 0 30px}
.phone-wrap{text-align:center}
.phone{width:390px;height:800px;border-radius:52px;background:#0E0E12;padding:12px;box-shadow:0 30px 70px rgba(20,20,40,.25)}
.phone iframe{width:100%;height:100%;border:0;border-radius:40px;background:#fff;display:block}
.phone-cap{margin-top:14px;font-size:13px;color:var(--muted)}

/* tech doc */
.doc{max-width:1040px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.05),0 24px 60px rgba(20,20,40,.1);padding:44px 52px 60px}
.doc h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
.doc .lead{color:var(--muted);font-size:15px;margin:0 0 30px;max-width:720px}
.doc h2{font-size:18px;margin:40px 0 14px;letter-spacing:-.01em}
.doc p{color:#3A3A45;max-width:760px}
.stacks{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stack{border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px}
.stack.rec{border-color:#C7CBFF;background:linear-gradient(#FAFAFF,#fff)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#F1F1F5;color:var(--muted);margin-bottom:10px}
.stack.rec .badge{background:var(--accent);color:#fff}
.stack h3{margin:0 0 14px;font-size:17px}
.stack dl{display:grid;grid-template-columns:92px 1fr;gap:9px 12px;margin:0 0 16px;font-size:13.5px}
.stack dt{color:var(--muted)}
.stack dd{margin:0}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;border-top:1px solid var(--line2);padding-top:14px}
.pc ul{margin:4px 0 0;padding-left:16px;color:#3A3A45}
.pc li{margin-bottom:4px}
.pc .t{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pc .pro .t{color:#067647}.pc .con .t{color:#B42318}
.flow{display:flex;align-items:stretch;gap:0;margin:8px 0 6px}
.node{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;background:#FCFCFD}
.node b{display:block;font-size:13.5px}
.node span{font-size:12px;color:var(--muted)}
.node.cf{border-color:#FCD9BD;background:#FFF9F4}
.arrow{display:grid;place-items:center;padding:0 8px;color:var(--faint);font-size:11.5px;text-align:center;min-width:72px;flex:none}
.arrow div{border-top:1.5px solid #D0D0D8;width:100%;margin:4px 0;position:relative}
.arrow div:after{content:"";position:absolute;right:-1px;top:-4.5px;border:4px solid transparent;border-left:6px solid #D0D0D8}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rule{border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.rule h4{margin:0 0 6px;font-size:14px}
.rule p{margin:0;font-size:13.5px;color:#454550}
pre{background:#14141B;color:#E4E4EE;border-radius:12px;padding:18px 20px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;margin:0}
pre .c{color:#7C7C8F}pre .k{color:#A5B4FC}
table.api{width:100%;border-collapse:collapse;font-size:13px}
table.api td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:top}
table.api td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:nowrap;width:300px}
table.api .m{display:inline-block;width:46px;font-weight:700;color:var(--accent)}
.qs{counter-reset:q;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.qs li{counter-increment:q;display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13.5px}
.qs li:before{content:counter(q);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:12px;display:grid;place-items:center}
.qs li i{color:var(--muted);font-style:normal;display:block;margin-top:2px;font-size:12.5px}

/* embed (inside phone) */
body.embed{background:#fff}
body.embed #wfbar,body.embed #notes{display:none}
body.embed #canvas{padding:0;overflow:hidden;display:flex}
body.embed .app{height:100vh}

@media (max-width:640px){
  .topbar{padding:0 16px;height:52px}
  .page{padding:16px 14px 110px}
  .sync .lbl-t{display:none}
  .who .h1{font-size:21px}
  .phead{gap:8px;margin-bottom:14px}
  .weeknav{margin-left:0;width:100%;justify-content:space-between;padding-top:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
  .weeknav .btn-ghost{display:none}
  .qa{padding:6px 6px 8px 12px}
  .qa-more{padding-left:0}
  .qa-foot{flex-wrap:wrap}
  .qa-foot .chips{flex:1 1 100%;overflow-x:auto}
  .qa-foot .btn-ghost{margin-left:auto}
  .qa-hint{display:none}
  .meta .proj{padding:0;background:none;font-size:0;gap:0}
  .meta .proj i{width:8px;height:8px}
  .from .ft{display:none}
  .acts{display:none}
  .due{display:none}
  .drawer{width:100%}
  .row{padding-left:12px}
  .viewing{font-size:12px}
  .qa .plus{display:none}
  .qa .chips{scrollbar-width:none}
  .seg{margin-right:0}
  .seg .sl{display:none}
  .seg button{padding:5px 9px}
  .wk{min-width:0}
  .board{grid-template-columns:repeat(7,78%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .col{scroll-snap-align:start;min-height:300px}
  .board-bar .hint{display:none}
  .team .trow{grid-template-columns:1fr auto;}
  .prow .avs,.prow .n{display:none}
  .pdesc{max-width:200px}
  .team .trow.th,.team .tstat,.team .tproj{display:none}
  .inv-grid{grid-template-columns:1fr}
  .topnav{margin-left:6px}
  .topnav button{padding:6px 9px}
  .logo{font-size:0;gap:0}
  .contrib{margin-bottom:16px}
  .help-b{grid-template-columns:1fr}
  .kb-btn{display:none}
  .peek{flex-wrap:wrap;gap:4px 10px}
  .peek .pk-d{order:3;width:100%}
  .carried-h .grow span,.carried-h .old{display:none}
  .field{white-space:normal;flex-wrap:wrap;row-gap:2px}
}
@media (max-width:980px){ .stacks,.rules{grid-template-columns:1fr} #notes{width:270px} }
</style>
</head>
<body>
<div id="shell">

  keys:`<h3>Keyboard</h3><p class="ns">The whole app works without a mouse. Close this sheet (<span class="kbd">Esc</span>) and try it.</p>

  today:`<h3>My day</h3><p class="ns">The week list narrowed to today only, for when you just want to get through the day.</p>

/* =========================================================
   Render: shell
   ========================================================= */
const canvas = document.getElementById('canvas');
const notesEl = document.getElementById('notes');
function renderShell(){
  if (EMBED) return;
  const sel = document.getElementById('asUser');
  sel.innerHTML = people().filter(u=>USERS[u].status==='active').map(u=>`<option value="${u}" ${u===ME?'selected':''}>${USERS[u].name} · ${isAdmin(u)?'Admin':'Member'}</option>`).join('');
  const a = activeTab();
  document.getElementById('tabs').innerHTML = TABS.map(([id,l],i) =>
    `<button class="${a===id?'on':''}" data-act="tab" data-t="${id}"><span>${i+1}</span>${l}</button>`).join('');
  notesEl.innerHTML = NOTES[a] || '';
  notesEl.classList.toggle('hide', !state.notes);
  document.getElementById('notesBtn').classList.toggle('on', state.notes);
}

function activeSelector(){
  const a = document.activeElement; if (!a || a===document.body || !canvas.contains(a)) return null;
  const nav = a.closest('[data-nav]'); if (nav) return `[data-nav="${nav.dataset.nav}"]`;
  if (a.classList.contains('drawer')) return '.drawer';
  if (a.id) return '#'+a.id;
  if (a.dataset.act){ const sc = a.closest('.drawer') ? '.drawer ' : '';
    return sc + `[data-act="${a.dataset.act}"]` + ['m','dir','s','u','k','d','t','pg','p','c'].map(x=>a.dataset[x]!=null?`[data-${x}="${a.dataset[x]}"]`:'').join(''); }
  return null;
}
function render(){
  const prevSel = activeSelector();
  const prevIdx = prevSel && prevSel.startsWith('[data-nav') ? [...canvas.querySelectorAll('[data-nav]')].indexOf(canvas.querySelector(prevSel)) : -1;
  renderShell();
  const sc = canvas.querySelector('.app-scroll'); const top = sc ? sc.scrollTop : 0;
  const ob = canvas.querySelector('.board'); const boardLeft = ob ? ob.scrollLeft : null;
  if (state.screen==='login') canvas.innerHTML = frame(loginHTML());
  else if (state.screen==='mobile') canvas.innerHTML = mobileHTML();
  else if (state.screen==='tech') canvas.innerHTML = techHTML();
  else canvas.innerHTML = EMBED ? appHTML() : frame(appHTML());
  const sc2 = canvas.querySelector('.app-scroll'); if (sc2) sc2.scrollTop = top;
  const bd = canvas.querySelector('.board');
  if (bd && bd.scrollWidth > bd.clientWidth){ const tc = bd.querySelector('.col.today');
    bd.scrollLeft = (boardLeft!=null) ? boardLeft : (tc ? tc.getBoundingClientRect().left - bd.getBoundingClientRect().left : 0); }
  const qi = canvas.querySelector('#qa-input'); if (qi) qi.value = state.qa.title;
  const qn = canvas.querySelector('#qa-notes'); if (qn){ qn.value = state.qa.notes; growNotes(qn); }
  // roving tabindex: exactly one task list item is in the Tab order
  const navs = [...canvas.querySelectorAll('[data-nav]')];
  const cur = (state.cursor && canvas.querySelector(`[data-nav="${state.cursor}"]`)) || navs[0];
  if (cur) cur.tabIndex = 0;
  canvas.querySelectorAll('.collapsed[data-nav]').forEach(b=>b.setAttribute('aria-expanded','false'));
  // put focus back where it was (or where an action asked for)
  const want = state.focusSel || prevSel; state.focusSel = null;
  if (want){
    let el = canvas.querySelector(want);
    if (!el && want.startsWith('[data-nav')) el = (prevIdx>=0 && navs[Math.min(prevIdx, navs.length-1)]) || cur;   // item left the view → its neighbour
    if (el){ el.focus({preventScroll:true}); if (el.matches('[data-nav]')) el.scrollIntoView({block:'nearest', inline:'nearest'});
      if (el.classList.contains('dr-title')){ const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } }
  }
  tickSync();
}
const frame = inner => `<div class="browser"><div class="bbar"><i></i><i></i><i></i><div class="url">🔒 tasks.yourcompany.com</div></div>${inner}</div>`;

/* =========================================================
   App (week view)
   ========================================================= */
function weekInfo(){
  const ws = addDays(weekStart(TODAY), state.weekOffset*7);
  const days = [...Array(7)].map((_,i)=>addDays(ws,i));
  const we = days[6]; const a = P(ws), b = P(we);
  const range = a.getMonth()===b.getMonth() ? `${MONS[a.getMonth()]} ${a.getDate()} – ${b.getDate()}, ${b.getFullYear()}` : `${MONS[a.getMonth()]} ${a.getDate()} – ${MONS[b.getMonth()]} ${b.getDate()}`;
  const o = state.weekOffset;
  const label = o===0?'This week':o===1?'Next week':o===-1?'Last week':o>0?`In ${o} weeks`:`${-o} weeks ago`;
  return {ws, we, days, range, label};
}
const inWeek = (d,w) => d>=w.ws && d<=w.we;
const sortRows = arr => arr.sort((a,b)=> (a.done-b.done) || (a.priority-b.priority) || (a.id.localeCompare(b.id,undefined,{numeric:true})));
const byPrioThenOldest = (a,b) => (a.priority-b.priority) || a.due.localeCompare(b.due);

function appHTML(){
  const u = state.viewUser, isMe = u===ME, w = weekInfo();
  const mine = vis().filter(t=>t.assignee===u);
  const carried = mine.filter(isLate).sort(byPrioThenOldest);
  const TD = state.view==='today';                       // "Today only" list
  const inScope = d => TD ? d===TODAY : inWeek(d,w);
  const byTasks = vis().filter(t=>(t.createdBy===u||t.assignedBy===u) && t.assignee!==u && inScope(eff(t)));
  const openWeek = mine.filter(t=>!t.done && inScope(eff(t))).length;
  const scopeWord = TD ? 'today' : 'this week';

  let sub = `${openWeek} open${TD?' today':''}`;
  if (state.weekOffset===0 && carried.length) sub += ` · <span class="lt">${carried.length} carried over</span>`;
  sub += ` · ${byTasks.filter(t=>!t.done).length} assigned to others`;

  // what's hidden in Today mode, as a one-line peek
  let peek = '';
  if (TD){
    const later = mine.filter(t=>!t.done && t.due>TODAY && inWeek(t.due,w));
    const per = {}; later.forEach(t=>per[t.due]=(per[t.due]||0)+1);
    const parts = Object.keys(per).sort().map(d=>`${d===addDays(TODAY,1)?'Tomorrow':DOW[P(d).getDay()]} ${per[d]}`);
    peek = later.length
      ? `<button class="peek" data-act="view-mode" data-m="list" data-nav="peek" tabindex="-1"><span>Later this week: <b>${later.length} task${later.length>1?'s':''}</b></span><span class="pk-d">${parts.join(' · ')}</span><span class="pk-go">Show week ${I.arrowR}</span></button>`
      : `<div class="peek quiet">Nothing else planned this week.</div>`;
  }

  const hiddenN = tasks.filter(t=>t.assignee===u && !canSee(t) && !t.done).length;
  const banner = isMe ? '' : `<div class="viewing">${I.eye}<span class="grow">You're viewing <b>${USERS[u].name}'s</b> week. Your changes are recorded in each task's history under your name.${hiddenN?` <span class="vh">Only projects you share are shown.</span>`:''}</span><button data-act="view" data-u="${ME}">Back to my week</button></div>`;

  // ---- assigned to
  const dayBlocks = (TD ? [TODAY] : w.days).map(d => {
    const dd = P(d), dn = d===TODAY ? 'Today' : DOW[dd.getDay()], dl = `${MONS[dd.getMonth()]} ${dd.getDate()}`;
    if (d < TODAY){
      const done = mine.filter(t=>t.done && eff(t)===d);
      const ghosts = mine.filter(t=>isLate(t) && t.due===d);
      const key = u+':'+d;
      const open = state.expanded.has(key) || state.weekOffset<0;
      const sum = [done.length?`${done.length} done`:'', ghosts.length?`<span class="c">${ghosts.length} carried to today</span>`:''].filter(Boolean).join(' · ') || 'Nothing recorded';
      if (!open) return `<div class="day"><button class="collapsed" data-act="expand" data-k="${key}" data-nav="day:${key}" tabindex="-1" aria-expanded="false"><span class="dn">${DOW[dd.getDay()]}</span> ${dl}<span class="sum">${sum} ${I.chev}</span></button></div>`;
      const rows = [...sortRows(done).map(t=>rowHTML(t,'to')), ...ghosts.map(t=>rowHTML(t,'ghost'))];
      return `<div class="day"><div class="day-h"><span class="dn">${DOW[dd.getDay()]}</span><span class="dd">${dl}</span>${state.weekOffset===0?`<button class="dc" data-act="expand" data-k="${key}" style="color:var(--accent)">Collapse</button>`:`<span class="dc">${sum.replace(/<[^>]+>/g,'')}</span>`}</div>
        ${rows.length?`<div class="card">${rows.join('')}</div>`:`<div class="empty-day">Nothing recorded</div>`}</div>`;
    }
    const list = sortRows(mine.filter(t=>eff(t)===d && !(d===TODAY && isLate(t))));
    const isT = d===TODAY;
    const carriedBlock = isT && carried.length ? `<div class="carried" data-carry>
        <div class="carried-h"><b>Carried over · ${carried.length}</b><span class="grow"><span class="old">oldest is ${Math.max(...carried.map(lateDays))} days late</span></span><button data-act="move-all">${I.cal} Move all</button></div>
        <div class="rows">${carried.map(t=>rowHTML(t,'carried')).join('')}</div></div>` : '';
    const openN = list.filter(t=>!t.done).length + (isT?carried.length:0);
    return `<div class="day">${TD ? '' : `<div class="day-h ${isT?'today':''}"><span class="dn">${dn}</span><span class="dd">${isT?DOW[dd.getDay()]+', ':''}${dl}</span><span class="dc">${openN?openN+' open':''}</span></div>`}
      ${carriedBlock}${list.length?`<div class="card">${list.map(t=>rowHTML(t,'to')).join('')}</div>`:(carriedBlock?'':`<div class="empty-day">${TD?'Nothing left for today. Nice.':'Nothing planned'}</div>`)}</div>`;
  }).join('');

  // ---- assigned by
  const groups = {};
  byTasks.sort((a,b)=>eff(a).localeCompare(eff(b))||(a.done-b.done)||(a.priority-b.priority)).forEach(t => (groups[t.assignee] ||= []).push(t));
  const byHTML = Object.keys(groups).length ? `<div class="card">${Object.entries(groups).map(([a,list]) =>
     `<div class="grp-h">${av(a,22)}<b>${USERS[a].name}</b><span class="n">${list.filter(t=>!t.done).length} open</span><button class="link" data-act="view" data-u="${a}">View week →</button></div>${list.map(t=>rowHTML(t,'by')).join('')}`).join('')}</div>`
     : `<div class="empty-sec">${isMe?"You haven't":first(u)+" hasn't"} assigned anything to others ${scopeWord}.</div>`;

  const {proj: qaProj, who: qaWho} = qaEff();
  const qaDate = state.qa.date || (inWeek(TODAY,w) ? TODAY : (w.ws > TODAY ? w.ws : TODAY));
  const qaOpen = state.qa.open || !!state.qa.title || !!state.qa.notes;
  const qaPh = qaOpen ? 'Task title' : qaWho===ME ? 'Add a task…' : `Add a task for ${first(qaWho)}…`;

  return `<div class="app">
    <div class="topbar">
      <button class="skip" data-act="skip">Skip to tasks</button>
      <div class="logo"><span class="logo-mark">${I.check}</span>taskivities</div>
      <nav class="topnav" aria-label="Main">
        <button class="${state.page==='tasks'?'on':''}" data-act="page" data-pg="tasks" ${state.page==='tasks'?'aria-current="page"':''}>Tasks</button>
        <button class="${state.page==='projects'?'on':''}" data-act="page" data-pg="projects" ${state.page==='projects'?'aria-current="page"':''}>Projects</button>
        ${isAdmin(ME) ? `<button class="${state.page==='team'?'on':''}" data-act="page" data-pg="team" ${state.page==='team'?'aria-current="page"':''}>Team</button>` : ''}

function addPeople(){
  const inv = state.invite; const raw = (canvas.querySelector('#inv-emails')?.value||'').trim(); inv.emails = raw;
  const emails = [...new Set(raw.split(/[\s,;]+/).filter(Boolean).map(e=>e.toLowerCase()))];
  const bad = emails.filter(e=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e));
  if (!emails.length){ inv.err = 'Enter at least one email address.'; state.focusSel = '#inv-emails'; return render(); }
  if (bad.length){ inv.err = `Not a valid email: ${esc(bad.join(', '))}`; state.focusSel = '#inv-emails'; return render(); }
  if (inv.role==='member' && !inv.projects.length){ inv.err = 'Pick at least one project for a member.'; return render(); }
  const existing = emails.filter(e=>Object.values(USERS).some(u=>u.email===e && u.status!=='removed'));
  const fresh = emails.filter(e=>!existing.includes(e));
  fresh.forEach((e,i) => { const id = 'u'+(++seq); const local = e.split('@')[0];
    USERS[id] = {name:local, first:local, color:PALETTE[(seq+i)%PALETTE.length], email:e, role:inv.role, projects:inv.role==='admin'?[]:[...inv.projects], status:'invited', added:TODAY};
    flash('u:'+id); });
  state.invite = null;
  toast(fresh.length ? `Added ${fresh.length} ${fresh.length>1?'people':'person'}${existing.length?` · ${existing.length} already on the team`:''}` : 'Everyone there is already on the team', false);
  state.focusSel = '[data-act="inv-open"]'; render();
}
function removeUser(u, to){
  const x = USERS[u]; const open = tasks.filter(t=>t.assignee===u && !t.done);
  open.forEach(t => { t.assignee = to; t.assignedBy = ME; log(t, `transferred from <b>${x.first}</b> to <b>${first(to)}</b>`, `${x.name} was removed from the team`); });
  x.status = 'removed';
  toast(`Removed ${esc(x.status==='invited'?x.email:x.name)}${open.length?` · ${open.length} task${open.length>1?'s':''} moved to ${first(to)}`:''}`, false);
}

  peSync(); const pe = state.projEdit; const name = pe.name.trim();
  if (!name){ pe.err = 'Give the project a name.'; state.focusSel = '#pe-name'; return render(); }

/* ---------- Projects page: everything finished in a project on one day ---------- */
const hm = at => { if (!at) return ''; const [h,m] = at.split('T')[1].split(':').map(Number); return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM'); };
const projBadge = (pid, s=40) => pid==='all'
  ? `<span class="pbadge all" style="--s:${s}px">${I.board}</span>`
  : `<span class="pbadge" style="--s:${s}px;background:${PROJECTS[pid].color}">${PROJECTS[pid].name.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>`;
function projectDay(pid, day){
  const inP = t => pid==='all' || t.project===pid;
  const done = vis().filter(t=>inP(t) && t.done && t.doneOn===day)
    .sort((a,b)=> (a.priority-b.priority) || a.due.localeCompare(b.due) || (a.doneAt||'').localeCompare(b.doneAt||''));
  const open = vis().filter(t=>inP(t) && !t.done && (day===TODAY ? eff(t)===TODAY : t.due===day)).sort(byPrioThenOldest);
  return {done, open};
}
function projectDayHTML(){
  const pid = state.proj, day = state.projDay, all = pid==='all';
  const {done, open} = projectDay(pid, day);
  const name = all ? 'All projects' : PROJECTS[pid].name;
  const doneHTML = done.length ? `<div class="card">${done.map(t=>rowHTML(t, all?'pdone-all':'pdone')).join('')}</div>`
    : `<div class="empty-sec">Nothing was finished in ${esc(name)} ${day===TODAY?'yet today':'on '+fmt(day)}.</div>`;
  const openHTML = open.length ? `<section class="sec">
      <button class="collapsed" data-act="proj-open" data-nav="popen" tabindex="-1" aria-expanded="${state.projOpen}"><span class="dn">Not finished</span> ${day===TODAY?'planned for today':'planned for this day'}<span class="sum">${open.length} task${open.length>1?'s':''} ${state.projOpen?'':I.chev}</span></button>
      ${state.projOpen ? `<div class="card" style="margin-top:8px">${open.map(t=>rowHTML(t,'popen')).join('')}</div>` : ''}
    </section>` : '';
  return `<div class="phead">
      <button class="who" data-act="proj-pick" ${all?'':`title="${esc(PROJECTS[pid].desc||'')}"`}>${projBadge(pid)}<span><span class="h1">${esc(name)} ${I.chev}</span>
        <span class="sub">${done.length} done${open.length?` · ${open.length} not finished`:''}</span></span></button>
      <div class="weeknav">
        <button class="icon-btn" data-act="pday" data-dir="-1" title="Previous day  [" aria-label="Previous day">${I.left}</button>
        <div class="wk"><b>${day===TODAY?'Today':day===addDays(TODAY,-1)?'Yesterday':DOW[P(day).getDay()]}</b><span>${fmt(day)}</span></div>
        <button class="icon-btn" data-act="pday" data-dir="1" title="Next day  ]" aria-label="Next day" ${day>=TODAY?'disabled':''}>${I.right}</button>
        <button class="btn-ghost" data-act="pday" data-dir="0" ${day===TODAY?'disabled':''}>Today</button>
        <button class="btn-ghost" data-act="copy-day" ${done.length?'':'disabled'} title="Copy a plain-text summary for chat or email">Copy summary</button>
      </div>
    </div>
    <section class="sec"><div class="sec-h"><h2>Done</h2><span class="cnt">by priority, then due date</span></div>${doneHTML}</section>

function copyDaySummary(){
  const pid = state.proj, day = state.projDay, {done} = projectDay(pid, day);
  const name = pid==='all' ? 'All projects' : PROJECTS[pid].name;
  const lines = [`${name}: done on ${fmt(day)} (${done.length})`, ...done.map(t=>`• ${t.priority!==NORMAL?'['+PRIOS[t.priority].name+'] ':''}${t.title}: ${USERS[t.assignee].name}${pid==='all'?' ('+PROJECTS[t.project].name+')':''}`)];
  const text = lines.join('\n');
  (navigator.clipboard?.writeText(text) || Promise.reject()).then(()=>toast(`Copied ${done.length} tasks as text`, false), ()=>toast('Copy failed. Select and copy manually.', false)).finally(render);
}

function boardHTML(u, w){
  const side = state.boardSide, isMe = u===ME;
  const pool = side==='to' ? vis().filter(t=>t.assignee===u)
                           : vis().filter(t=>(t.createdBy===u||t.assignedBy===u) && t.assignee!==u);
  const nTo = vis().filter(t=>t.assignee===u && !t.done && inWeek(eff(t),w)).length;
  const nBy = vis().filter(t=>(t.createdBy===u||t.assignedBy===u) && t.assignee!==u && !t.done && inWeek(eff(t),w)).length;
  const cols = w.days.map(d => {
    const dd = P(d), past = d < TODAY, isT = d===TODAY, we = dd.getDay()%6===0;
    const carried = isT ? pool.filter(isLate).sort(byPrioThenOldest) : [];
    const list = past ? sortRows(pool.filter(t=>t.done && eff(t)===d))
                      : sortRows(pool.filter(t=>eff(t)===d && !(isT && isLate(t))));
    const ghosts = past ? pool.filter(t=>isLate(t) && t.due===d).length : 0;
    const open = list.filter(t=>!t.done).length + carried.length;
    return `<div class="col ${past?'past':''} ${isT?'today':''} ${we?'we':''}" data-day="${d}" ${past?'':'data-drop'}>
      <div class="col-h"><span class="dn">${isT?'Today':DOW[dd.getDay()]}</span><span class="dd">${MONS[dd.getMonth()]} ${dd.getDate()}</span><span class="n">${open||''}</span></div>
      <div class="col-b">
        ${carried.length ? `<div class="col-carry" data-carry><div class="cc-h"><span>Carried · ${carried.length}</span><button data-act="move-all">Move all</button></div>${carried.map(t=>cardHTML(t,side)).join('')}</div>` : ''}
        ${list.map(t=>cardHTML(t,side)).join('')}
        ${ghosts ? `<div class="col-note">${ghosts} carried to today →</div>` : ''}
        ${past ? (list.length||ghosts ? '' : '<div class="col-note">Nothing recorded</div>')
               : `<button class="col-add" data-act="col-add" data-d="${d}" data-nav="add:${d}" tabindex="-1" aria-label="Add a task on ${fmt(d)}">${I.plus.replace(/18/g,'13')} Add</button>`}
      </div>
    </div>`;
  }).join('');
  return `<div class="board-bar">
      <div class="seg sm">
        <button class="${side==='to'?'on':''}" data-act="board-side" data-s="to">Assigned to ${isMe?'me':first(u)} <span>${nTo}</span></button>
        <button class="${side==='by'?'on':''}" data-act="board-side" data-s="by">Assigned by ${isMe?'me':first(u)} <span>${nBy}</span></button>
      </div>
      <span class="hint">Drag a card to another day, or select it and press <kbd>⇧</kbd><kbd>←</kbd> <kbd>⇧</kbd><kbd>→</kbd>. Past days are read-only.</span>
    </div>
    <div class="board">${cols}</div>`;
}
function cardHTML(t, side){
  const late = isLate(t);
  const who = side==='by' ? t.assignee : (t.assignedBy!==t.assignee ? t.assignedBy : null);

function rowHTML(t, ctx){
  const late = isLate(t);
  const cls = ['row', t.done?'done':'', ctx==='ghost'?'ghost':'', ctx.startsWith('pdone')?'report':'', state.flash.has(t.id)?'flash':''].join(' ');
  let meta = proj(t.project);
  if (ctx==='to' || ctx==='carried'){
    if (t.assignedBy!==t.assignee) meta += `<span class="from">${av(t.assignedBy,18)}<span class="ft">from ${first(t.assignedBy)}</span></span>`;
  }
  if (ctx==='carried') meta += `<span class="due">due ${fmt(t.due)}</span>${lateB(t)}`;
  if (ctx==='by') meta += late ? `<span class="due">due ${fmt(t.due)}</span>${lateB(t)}` : `<span class="datep">${rel(eff(t))}</span>`;
  if (ctx==='ghost') meta = `<span class="ghost-tag">→ carried to today</span>`;
  if (ctx==='pdone' || ctx==='pdone-all'){
    meta = (ctx==='pdone-all' ? proj(t.project) : '')
      + `<span class="from">${av(t.assignee,18)}<span class="ft">${first(t.assignee)}</span></span>`
      + `<span class="due">due ${rel(t.due)}</span>`
      + (t.doneOn > t.due ? `<span class="late">${diff(t.doneOn,t.due)}d late</span>` : '')

    <div class="meta">${meta}</div>${acts}
  </div>`;
}

function calHTML(month, sel){
  const m1 = month; const f = P(m1);
  const start = addDays(m1, -((f.getDay()+6)%7));
  let cells = '';
  for (let i=0;i<42;i++){
    const d = addDays(start,i), dd = P(d);
    const c = [dd.getMonth()!==f.getMonth()?'om':'', d===TODAY?'td':'', d===sel?'sel':''].join(' ');
    cells += `<button class="${c}" ${d<TODAY?'disabled':`data-act="setdate" data-d="${d}"`}>${dd.getDate()}</button>`;
  }
  return `<div class="cal"><div class="cal-h"><button class="icon-btn" data-act="cal" data-dir="-1">${I.left}</button><b>${MONL[f.getMonth()]} ${f.getFullYear()}</b><button class="icon-btn" data-act="cal" data-dir="1">${I.right}</button></div>
    <div class="cal-g">${['M','T','W','T','F','S','S'].map(x=>`<span class="dw">${x}</span>`).join('')}${cells}</div></div>`;
}
const monthOf = d => d.slice(0,8)+'01';

/* =========================================================
   Mutations (each one writes a history entry)
   ========================================================= */
const snap = () => { undoSnap = JSON.stringify(tasks); };
const log = (t, html, note) => t.events.push({at:now(), actor:ME, html, ...(note?{note}:{})});
const flash = id => { state.flash.add(id); setTimeout(()=>state.flash.delete(id), 2700); };
function toast(text, undo){ state.toast = {text, undo}; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ state.toast=null; const el = canvas.querySelector('.toast'); if (el) el.remove(); }, 4500); }

function toggleDone(id){ const t = T(id); snap();
  t.done = !t.done; t.doneOn = t.done ? TODAY : null; t.doneAt = t.done ? now() : null; t.doneBy = t.done ? ME : null;
  log(t, t.done ? 'marked this done' : 'reopened this task');
  if (t.done) toast(`Done: ${esc(t.title)}`, true);
  flash(id);
}
function moveDate(ids, d){ snap();
  ids.forEach(id => { const t = T(id); if (t.due===d) return;
    const wl = isLate(t) ? ` <span style="color:var(--faint)">(was ${lateDays(t)}d late)</span>` : '';
    log(t, `moved date <b>${fmt(t.due)}</b> → <b>${fmt(d)}</b>${wl}`); t.due = d; flash(id); });
  toast(ids.length>1 ? `Moved ${ids.length} tasks to ${rel(d)}` : `Moved to ${rel(d)}`, true);
}
function reassign(id, u, note){ const t = T(id); if (t.assignee===u) return; snap();
  const from = t.assignee; t.assignee = u; t.assignedBy = ME;
  log(t, `transferred from <b>${first(from)}</b> to <b>${first(u)}</b>`, note||null);
  flash(id); toast(`Transferred to ${USERS[u].name}`, true);
}
function setPriority(id, p){ const t = T(id); snap(); log(t, `changed priority <b>${PRIOS[t.priority].name}</b> → <b>${PRIOS[p].name}</b>`); t.priority = p; flash(id); toast(`Priority set to ${PRIOS[p].name}`, true); }
function setProject(id, p){ const t = T(id); snap(); log(t, `changed project <b>${PROJECTS[t.project].name}</b> → <b>${PROJECTS[p].name}</b>`); t.project = p; }
function addTask(){
  const inp = canvas.querySelector('#qa-input'); const title = (inp?.value||'').trim();
  if (!title){ const q = canvas.querySelector('#qa'); q.classList.remove('shake'); void q.offsetWidth; q.classList.add('shake'); inp.focus(); return; }
  const w = weekInfo();
  const {proj, who} = qaEff();
  const due = state.qa.date || (inWeek(TODAY,w) ? TODAY : (w.ws > TODAY ? w.ws : TODAY));
  let priority = state.qa.priority, clean = title;
  const bang = clean.match(/^(!{1,2})\s*/);                      // "!Fix bug" → High, "!!Prod down" → Urgent
  if (bang) { priority = bang[1].length===2 ? 1 : 2; clean = clean.slice(bang[0].length) || title; }
  const id = 't'+(++seq);
  const notes = (canvas.querySelector('#qa-notes')?.value || state.qa.notes || '').trim();
  tasks.push({id,title:clean,project:proj,assignee:who,createdBy:ME,assignedBy:ME,due,priority,done:false,doneOn:null,notes,
    events:[{at:now(),actor:ME,html:`created this task${who!==ME?` for <b>${first(who)}</b>`:''} · due ${fmt(due)}${priority!==NORMAL?` · ${PRIOS[priority].name} priority`:''}`}]});
  undoSnap = null; flash(id);
  state.qa = {title:'', notes:'', open:true, project:proj, date:null, assignee:null, priority:NORMAL};
  toast(`Added for ${who===ME?'you':first(who)} · ${rel(due)}${inWeek(due,w)?'':' (another week)'}`, false);
  render(); setTimeout(()=>canvas.querySelector('#qa-input')?.focus(), 0);

  tasks.push({id,title:'Review Q4 deck before Friday',project:proj,assignee:ME,createdBy:from,assignedBy:from,due:TODAY,priority:2,done:false,doneOn:null,notes:'',

// "polling" heartbeat: every 10s pretend we synced
function tickSync(){ const el = canvas.querySelector('.sync-ago'); if (!el) return;
  const s = Math.floor((Date.now()-state.lastSync)/1000); el.textContent = s<3 ? 'just now' : `synced ${s}s ago`; }
setInterval(tickSync, 1000);
setInterval(()=>{ state.lastSync = Date.now(); tickSync(); }, 10000);

  <h2>The rules behind the screens</h2>
  <div class="rules">
    <div class="rule"><h4>Rollover is computed, never stored</h4><p>The date shown for a task is <code>today</code> if it's open and overdue, and its <code>due_date</code> otherwise. No nightly job, nothing to drift out of sync. At midnight in the team's time zone, overdue tasks simply appear under today, and "days late" keeps counting. Moving a task sets a new <code>due_date</code> and writes a history entry.</p></div>
    <div class="rule"><h4>History is append-only</h4><p>Every change goes through one function that updates <code>tasks</code> and inserts into <code>task_events</code> in the same D1 batch. The API has no update or delete route for events. A transfer stores who it went from and to, plus the optional note.</p></div>
    <div class="rule"><h4>Roles and project access</h4><p><b>Admins</b> see every project and are the only ones who can add or remove people, change roles and manage projects. <b>Members</b> belong to one or more projects (<code>project_members</code>). Every query the Worker runs is scoped to <code>project_id IN (:my_projects)</code> for members, in one middleware, so no route can forget it. Admin actions are written to an <code>audit_log</code>.</p></div>
    <div class="rule"><h4>Transfers stay inside the project</h4><p>Within their projects, members can transfer any task, with no ownership checks, because the history provides the accountability. The new assignee must be on the task's project (admins always are), so nobody is assigned something they can't see. Moving a task to another project is allowed only if the assignee is on that project too. <code>assigned_by</code> drives the "Assigned by me" list.</p></div>
    <div class="rule"><h4>Every task: a project, a date, an owner, a priority</h4><p><code>project_id</code>, <code>due_date</code>, <code>assignee_id</code> and <code>priority</code> are <code>NOT NULL</code>, and the API rejects any attempt to clear them. Creating a task defaults to your last project, today, you and Normal priority. When someone leaves the team, their open tasks must be transferred (in bulk, logged) before the account can be deactivated. In the same way, a project can only be archived once its open tasks have been moved to another project. No task is ever left without a project or an owner.</p></div>
    <div class="rule"><h4>Project day is a read of finished work</h4><p>The Projects page lists tasks with <code>project_id = :p</code> and <code>done_at</code> on the chosen day (team time zone), as one list ordered by priority, then due date, then finish time. Everyone can see every project; there are no per-project permissions in a single-tenant team. An index on <code>(project_id, done_at)</code> keeps it instant.</p></div>
    <div class="rule"><h4>Done tasks stay where they finished</h4><p>A task completed late is shown on the day it was finished (<code>done_at</code>), not back on its old due date, so finishing a carried-over task today keeps it under today.</p></div>
    <div class="rule"><h4>Cheap polling</h4><p>Every write increases a global <code>version</code> counter in the same batch. Clients send the last version they saw and get back either 304 or only the changed tasks. Polling slows to every 60s when the tab is hidden, and syncs immediately when the tab regains focus.</p></div>

  <h2>Data model</h2>
<pre><span class="k">users</span>        id, email <span class="c">-- unique, the only way in</span>, name, avatar_url,

  <h2>MCP server for AI assistants</h2>

  <h2>Open questions for you</h2>
  <ol class="qs">
    <li><div><b>What counts as "assigned by me"?</b><i>The wireframe uses: tasks I created or last transferred that are now with someone else. Should a task stay on my list after it's passed on a second time?</i></div></li>
    <li><div><b>Can tasks be deleted?</b><i>Suggestion: "Archive" instead of delete. The task is hidden, the event is logged, and the history stays intact.</i></div></li>
    <li><div><b>What does "assign across projects" mean?</b><i>The wireframe reads it as: a member works across all of their own projects, and can assign a task to anyone on that task's project. The alternative is letting members assign to people outside the project, but then the assignee couldn't see their own task.</i></div></li>
